# Drop banned SMTP/IMAP abuse sources in Docker's DOCKER-USER chain.
# Required because published container ports bypass firewalld INPUT filtering.

[Definition]
actionstart =
actionstop =
actioncheck = iptables -n -L DOCKER-USER >/dev/null 2>&1
actionban = iptables -I DOCKER-USER -s <ip> -j DROP -m comment --comment "exim-docker-f2b"
actionunban = iptables -D DOCKER-USER -s <ip> -j DROP -m comment --comment "exim-docker-f2b"
