# Fail2ban filter for exim-docker — AUTH abuse only.
# Date is matched by datepattern and stripped before failregex runs.
#
# Does NOT match normal MX traffic (RCPT rejects, EHLO/QUIT without AUTH).

[INCLUDES]
before = common.conf

[Definition]
failregex = ^\s*\[\d+\] SMTP protocol error in "AUTH[^"]*" H=\S+ \[<HOST>\](?::\d+)? .*AUTH command used when not advertised
            ^\s*\[\d+\] \S+ authenticator failed for \S+ \[<HOST>\](?::\d+)?
            ^\s*\[\d+\] H=\S+ \[<HOST>\](?::\d+)? .*rejected AUTH
            ^\s*\[\d+\] H=\S+ \[<HOST>\](?::\d+)? .*Incorrect authentication data

ignoreregex =

datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S(?:\.%%f)?
